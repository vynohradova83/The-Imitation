<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Image Effects</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>CSS3 Image Effects Project</h1>

<div class="gallery">

    <div class="card">
        <h2>Penguins</h2>

        <div class="penguins">
            <img src="penguins.jpg" alt="Penguins">
        </div>
    </div>

    <div class="card">
        <h2>Dinosaur</h2>

        <div class="dinosaur">
            <img src="dinosaur.png" alt="Dinosaur">
        </div>
    </div>

    <div class="card">
        <h2>Seagull</h2>

        <div class="seagull">
            <img src="seagull.png" alt="Seagull">
        </div>
    </div>
  
    <div class="card">
        <h2>Butterfly</h2>

        <div class="butterfly">
            <img src="butterfly.jpg" alt="Butterfly">
        </div>
    </div>

    <div class="card">
        <h2>Theater Stage</h2>

        <div class="theater">
            <img src="theater_stage.jpg" alt="Theater Stage">

            <div class="presenting">
                Presenting
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Football Field</h2>

        <div class="football">

            <img
                src="football_field.jpg"
                alt="Football Field"
                class="field">

            <img
                src="tic-tac-toe.png"
                alt="Overlay"
                class="overlay">

        </div>
    </div>

</div>

</body>
</html>
