<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Imitation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>The Imitation</h1>

<div class="gallery">

    <div class="card">
        <h2>Penguins</h2>

        <div class="penguins">
            <img src="penguins.jpg" alt="Penguins">
        </div>
    </div>

    <div class="card">
        <h2>Dinosaur</h2>

        <div class="dinosaur">
            <img src="dinosaur.png" alt="Dinosaur">
        </div>
    </div>

    <div class="card">
        <h2>Seagull</h2>

        <div class="seagull">
            <img src="seagull.png" alt="Seagull">
        </div>
    </div>
  
    <div class="card">
        <h2>Butterfly</h2>

        <div class="butterfly">
            <img src="butterfly.jpg" alt="Butterfly">
        </div>
    </div>

    <div class="card">
        <h2>Theater Stage</h2>

        <div class="theater">
            <img src="theater_stage.jpg" alt="Theater Stage">

            <div class="presenting">
                Presenting
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Football Field</h2>

        <div class="football-board">
  <div class="border-top">
    <div class="cell x">X</div>
    <div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div>
    <div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div>
    <div class="cell x">X</div>
  </div>

  <div class="border-left">
    <div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div>
  </div>

  <div class="field-container">
    <img src="путь_к_картинке_поля.jpg" alt="Football Field" class="football-field">
  </div>

  <div class="border-right">
    <div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div>
  </div>

  <div class="border-bottom">
    <div class="cell x">X</div>
    <div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div>
    <div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div><div class="cell o">O</div>
    <div class="cell x">X</div>
  </div>
</div>

</body>
</html>
